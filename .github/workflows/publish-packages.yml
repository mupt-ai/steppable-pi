name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: ai
        type: choice
        options:
          - ai
          - agent
          - coding-agent
          - all

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show trusted publishing npm version
        run: npx -y npm@latest --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish packages
        env:
          PACKAGE_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
        run: |
          case "${PACKAGE_SELECTION}" in
            ai)
              workspaces="packages/ai"
              ;;
            agent)
              workspaces="packages/agent"
              ;;
            coding-agent)
              workspaces="packages/coding-agent"
              ;;
            all)
              workspaces="packages/ai packages/agent packages/coding-agent"
              ;;
            *)
              echo "Unknown package selection: ${PACKAGE_SELECTION}" >&2
              exit 1
              ;;
          esac

          for workspace in ${workspaces}; do
            name=$(node -p "require('./${workspace}/package.json').name")
            version=$(node -p "require('./${workspace}/package.json').version")

            if npx -y npm@latest view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; already published"
              continue
            fi

            echo "Publishing ${name}@${version}"
            npx -y npm@latest publish --workspace "${workspace}" --access public --tag latest --provenance
          done
