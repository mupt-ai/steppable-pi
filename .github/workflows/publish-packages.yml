name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: all
        type: choice
        options:
          - ai
          - agent
          - coding-agent
          - all

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release source is main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "main" ]; then
              echo "Manual publishes must run from main, got ${REF_NAME}" >&2
              exit 1
            fi
            exit 0
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "Release tags must point at a commit reachable from origin/main" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show trusted publishing npm version
        run: npx -y npm@latest --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish packages
        env:
          PACKAGE_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}
        run: |
          case "${PACKAGE_SELECTION}" in
            ai)
              workspaces="packages/ai"
              ;;
            agent)
              workspaces="packages/agent"
              ;;
            coding-agent)
              workspaces="packages/coding-agent"
              ;;
            all)
              workspaces="packages/ai packages/agent packages/coding-agent"
              ;;
            *)
              echo "Unknown package selection: ${PACKAGE_SELECTION}" >&2
              exit 1
              ;;
          esac

          for workspace in ${workspaces}; do
            name=$(node -p "require('./${workspace}/package.json').name")
            version=$(node -p "require('./${workspace}/package.json').version")

            if npx -y npm@latest view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; already published"
              continue
            fi

            echo "Publishing ${name}@${version}"
            npx -y npm@latest publish --workspace "${workspace}" --access public --tag latest --provenance
          done
